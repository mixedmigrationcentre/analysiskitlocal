# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          # Hard dependencies only (Depends/Imports/LinkingTo), not Suggests.
          #
          # The action's default is '"all"', which includes Suggests - and two
          # of ours, analysistools and cleaningtools, exist only on GitHub
          # (impact-initiatives/*). pak looks for them on CRAN, does not find
          # them, and the whole solve fails before anything is installed:
          #   "Can't find package called analysistools, cleaningtools"
          # The "any::pkgdown / any::sessioninfo: dependency conflict" lines
          # that follow are that same failure, not a separate problem.
          #
          # Nothing in the site build needs the optional set: every example
          # that reaches the survey engine is wrapped in \dontrun, and there
          # are no vignettes. Skipping it also spares CI a source build of
          # survey and srvyr on every push.
          dependencies: '"hard"'

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs